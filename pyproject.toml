[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "univi"
version = "1.0.0"
description = "UniVI: a mixture-of-experts multimodal variational autoencoder for integrating, translating, and generating single-cell multi-omics data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Andrew J. Ashford", email = "ashforda@ohsu.edu" }
]
keywords = [
  "single-cell", "multi-omics", "multimodal", "variational autoencoder",
  "mixture of experts", "data integration", "CITE-seq", "multiome",
  "scRNA-seq", "scATAC-seq", "TEA-seq", "anndata", "pytorch",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "anndata>=0.10",
  "scanpy>=1.11",
  "torch>=2.2",
  "scikit-learn>=1.3",
  "h5py>=3.10",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "tqdm>=4.66",
  "joblib>=1.3",
  "openpyxl>=3.1",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Ashford-A/UniVI"
Documentation = "https://univi.readthedocs.io"
Repository = "https://github.com/Ashford-A/UniVI"
Paper = "https://doi.org/10.1101/gr.281431.125"
Changelog = "https://github.com/Ashford-A/UniVI/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Ashford-A/UniVI/issues"

[project.optional-dependencies]
tutorials = ["scikit-misc>=0.3", "jupyterlab>=4", "nbformat>=5.9"]
bench = ["harmonypy>=0.0.9"]
test = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6"]
docs = [
  "sphinx>=8",
  "sphinx-book-theme>=1.1",
  "myst-nb>=1.1",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]

[project.scripts]
univi = "univi.cli:main"

[tool.setuptools.packages.find]
include = ["univi*"]

[tool.setuptools.package-data]
"univi.datasets" = ["registry.json"]

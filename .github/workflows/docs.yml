name: Documentation and biological workflow checks
on:
  push:
    paths: ['docs/**', 'univi/**', 'tests/**', 'scripts/**', '.readthedocs.yaml', '.github/workflows/docs.yml', 'pyproject.toml', 'MANIFEST.in', 'CHANGELOG.md', 'RELEASE.md', 'README.md']
  pull_request:
    paths: ['docs/**', 'univi/**', 'tests/**', 'scripts/**', '.readthedocs.yaml', '.github/workflows/docs.yml', 'pyproject.toml', 'MANIFEST.in', 'CHANGELOG.md', 'RELEASE.md', 'README.md']
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt nbformat
      - run: python scripts/build_tutorial_docs.py --check
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
  helpers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[tutorials,test]'
      - run: python -m pytest -q tests
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python scripts/verify_release.py dist

{% set name = "univi" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Local developer build from this checkout. The official conda-forge
  # feedstock uses the published PyPI sdist and its verified SHA-256.
  path: ..

build:
  number: 0
  noarch: python
  entry_points:
    - univi = univi.cli:main
  # IMPORTANT: no-build-isolation so pip uses the conda host env (with setuptools/wheel)
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel

  run:
    - python >=3.10

    # Core numerics / data
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.1

    # Single-cell ecosystem
    - anndata >=0.10
    - scanpy >=1.11

    # DL / ML
    - pytorch >=2.2
    - scikit-learn >=1.3

    # I/O and stats helpers
    - h5py >=3.10
    - pyyaml >=6.0

    # plotting / viz
    - matplotlib >=3.8
    - seaborn >=0.13

    # clustering / graphs
    - python-igraph >=0.11
    - leidenalg >=0.10

    # misc
    - tqdm >=4.66
    - joblib >=1.3
    - openpyxl >=3.1

test:
  imports:
    - univi
    - univi.refinement
    - univi.preprocessing
    - univi.workflows
    - univi.datasets
    - univi.perturbation
  commands:
    - python -c "import univi; assert univi.__version__ == '{{ version }}'; from univi import UniVIRefiner, save_reference"

about:
  home: https://github.com/Ashford-A/UniVI
  summary: "UniVI: a scalable multi-modal variational autoencoder toolkit for seamless integration and analysis of multimodal single-cell data."
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Ashford-A
